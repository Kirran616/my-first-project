<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reel | Kirran Suleman's portfolio assistant</title>
  <meta name="description" content="Ask Reel about Kirran Suleman's skills, AI UGC ad projects, experience and education.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Apply the saved or system theme before first paint to avoid a flash.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("reel-theme"); } catch (e) {}
      var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="identity">
        <img class="avatar" src="https://kirransuleman-portfolio.netlify.app/assets/images/profile.jpg"
             alt="Portrait of Kirran Suleman" width="44" height="44"
             onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'avatar avatar-fallback',textContent:'R'}))">
        <div>
          <h1>Reel</h1>
          <p><span class="status-dot" aria-hidden="true"></span>Kirran's portfolio assistant</p>
        </div>
      </div>
      <div class="actions">
        <a class="link-btn" href="https://kirransuleman-portfolio.netlify.app" target="_blank" rel="noopener">View portfolio</a>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="chat" id="chat" aria-live="polite" aria-label="Conversation">
      <section class="welcome" id="welcome">
        <h2>Hi, I'm Reel. I know Kirran's work inside out.</h2>
        <p>Ask about AI UGC ads, motion graphics, tools, experience or how to start a project.</p>
        <div class="chips" id="chips">
          <button type="button" class="chip">What does Kirran do?</button>
          <button type="button" class="chip">Which brands has Kirran made ads for?</button>
          <button type="button" class="chip">What tools and skills does Kirran use?</button>
          <button type="button" class="chip">Tell me about Kirran's education</button>
          <button type="button" class="chip">How can I hire Kirran?</button>
        </div>
      </section>
    </main>

    <form class="composer" id="composer" autocomplete="off">
      <label class="sr-only" for="input">Message Reel</label>
      <textarea id="input" rows="1" maxlength="1000" placeholder="Ask about Kirran's work"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <p class="fineprint">Reel is an AI assistant and answers from Kirran's portfolio only.</p>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
